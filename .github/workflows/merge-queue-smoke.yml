# Fast merge-queue gate. The full required matrix (_required.yml, ci.yml,
# release.yml) runs on every pull_request and on push to main, exactly as
# before; merge_group re-validation is this single fast job, so a queued merge
# occupies one runner slot for < 5 min instead of re-running the whole
# podman-container matrix. The `merge-queue-smoke` context this job produces is
# the single required status check for the merge queue.
name: Merge Queue Smoke

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: mq-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-queue-smoke:
    name: merge-queue-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Real, fail-fast validations borrowed from the fastest required jobs.
      # A malformed workflow, lint-breaking YAML, or markdown violation in the
      # merge group fails the queue entry.
      - name: Lint all YAML files
        run: |
          pip install yamllint
          yamllint -c .yamllint.yaml .

      - name: Validate workflow YAML files against GitHub Actions schema
        run: |
          pip install check-jsonschema
          check-jsonschema \
            --schemafile https://json.schemastore.org/github-workflow \
            .github/workflows/*.yml

      - name: Markdownlint
        run: |
          npx --yes markdownlint-cli2@0.13.0 .
