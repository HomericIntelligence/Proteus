      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-proteus-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-proteus-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t proteus-ci:local .
      - name: Run Gitleaks
        run: |
          if [ -f .gitleaks.toml ]; then
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace proteus-ci:local \
              gitleaks detect --source /workspace --config .gitleaks.toml \
                --report-format sarif --report-path gitleaks.sarif --redact
          else
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace proteus-ci:local \
              gitleaks detect --source /workspace \
                --report-format sarif --report-path gitleaks.sarif --redact
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3
        with:
          sarif_file: gitleaks.sarif

  security-npm-audit:
    name: security/npm-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dagger/package-lock.json

      - name: Install dependencies (locked)
        run: cd dagger && npm ci

      - name: npm audit (production, high+)
        run: cd dagger && npm audit --omit=dev --audit-level=high

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Validate shell script shebangs
        run: |
          count=$(find . -name "*.sh" | xargs head -1 | grep -c "#!/" || true)
          echo "Found ${count} shebang line(s) across shell scripts"

      - name: Bash syntax check on all shell scripts
        run: find . -name "*.sh" | xargs -I{} bash -n {}

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
